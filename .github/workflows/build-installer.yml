name: Build Installer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            ext: exe
          - os: ubuntu-latest
            platform: linux
            ext: AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Create dependencies folder
        if: matrix.platform == 'win'
        run: |
          New-Item -ItemType Directory -Force -Path dependencies | Out-Null
        shell: powershell

      - name: Download Npcap installer
        if: matrix.platform == 'win'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.87.exe" -OutFile "dependencies\npcap-1.87.exe"
        shell: powershell

      - name: Install UPX (Windows)
        if: matrix.platform == 'win'
        run: choco install upx -y
        shell: powershell

      - name: Install UPX (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
        shell: bash

      - name: Build Python logger (Windows)
        if: matrix.platform == 'win'
        run: |
          cd logger
          python -m venv .venv
          .\.venv\Scripts\activate
          pip install scapy pyinstaller
          pyinstaller logger.spec -y
          cd ..
        shell: powershell

      - name: Build Python logger (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd logger
          python -m venv .venv
          source .venv/bin/activate
          pip install scapy pyinstaller
          pyinstaller logger.spec -y
          cd ..
        shell: bash

      - name: Grant capture permission (Linux)
        if: matrix.platform == 'linux'
        # See docs/BUILDING.md - this may not survive AppImage packaging;
        # the manual `setcap` step documented for users is the fallback.
        run: sudo setcap cap_net_raw+eip logger/dist/logger
        shell: bash

      - name: Report Python logger size
        if: matrix.platform == 'win'
        run: |
          $exe = Get-Item "logger\dist\logger.exe"
          "{0:N1} MB - logger.exe" -f ($exe.Length / 1MB)
        shell: powershell

      - name: Report Python logger size (Linux)
        if: matrix.platform == 'linux'
        run: du -h logger/dist/logger
        shell: bash

      - name: Install frontend/Electron dependencies
        run: |
          cd client
          npm ci
        shell: bash

      - name: Build and package (installer + unpacked)
        run: |
          cd client
          npm run build:${{ matrix.platform }}
        shell: bash

      - name: Report installed size breakdown
        if: matrix.platform == 'win'
        run: |
          $root = "client\dist\win-unpacked"
          $total = (Get-ChildItem $root -Recurse -File | Measure-Object -Property Length -Sum).Sum
          "{0:N1} MB - TOTAL (win-unpacked)" -f ($total / 1MB)
          ""
          "-- by top-level folder/file --"
          Get-ChildItem $root | ForEach-Object {
            $size = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum } else { $_.Length }
            [PSCustomObject]@{ Name = $_.Name; MB = [math]::Round($size / 1MB, 1) }
          } | Sort-Object MB -Descending | Format-Table -AutoSize
          ""
          "-- 15 largest individual files --"
          Get-ChildItem $root -Recurse -File | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object {
            [PSCustomObject]@{ MB = [math]::Round($_.Length / 1MB, 1); Path = $_.FullName.Substring($root.Length + 1) }
          } | Format-Table -AutoSize
        shell: powershell

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdo-combat-logger-installer-${{ matrix.platform }}
          path: client/dist/bdo-combat-installer-v${{ steps.get_version.outputs.VERSION }}.${{ matrix.ext }}
