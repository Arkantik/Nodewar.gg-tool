name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create dependencies folder
        run: mkdir -p dependencies

      - name: Download Npcap installer
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.87.exe" -OutFile "dependencies\npcap-1.87.exe"
        shell: powershell

      - name: Build Python logger
        run: |
          cd logger
          python -m venv .venv
          .\.venv\Scripts\activate
          pip install scapy pyinstaller
          pyinstaller logger.spec -y
        shell: powershell

      - name: Install frontend/Electron dependencies
        run: |
          cd client
          npm ci

      - name: Release (bump version, build installer, publish to GitHub Releases)
        working-directory: client
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
