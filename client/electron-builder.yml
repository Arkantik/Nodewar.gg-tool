appId: nodewargg.tool
productName: BDO Combat Logger
directories:
  output: dist
  buildResources: build

afterPack: build/afterPack.js

files:
  - out/**/*
  - package.json

win:
  icon: build/icon.png
  executableName: bdo-combat-logger-win_x64
  extraResources:
    - from: ../logger/dist/logger.exe
      to: logger/logger.exe
    - from: ../dependencies
      to: dependencies
      filter:
        - npcap-*.exe
  target:
    - target: nsis
      arch: [x64]
    - target: dir
      arch: [x64]

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: bdo-combat-installer-v${version}.${ext}

linux:
  icon: build/icon.png
  executableName: bdo-combat-logger-linux_x64
  extraResources:
    - from: ../logger/dist/logger
      to: logger/logger
  target:
    - target: AppImage
      arch: [x64]
  artifactName: bdo-combat-installer-v${version}.${ext}

publish:
  provider: github
  owner: Arkantik
  repo: Nodewar.gg-tool
