appId: ikusa.logger
productName: BDO Combat Logger
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../logger/dist/logger
    to: logger
  - from: ../dependencies
    to: dependencies
    filter:
      - npcap-*.exe

win:
  icon: ../logger/icon/icon-2.ico
  executableName: bdo-combat-logger-win_x64
  target:
    - target: nsis
      arch: [x64]
    - target: dir
      arch: [x64]

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: bdo-combat-installer-v${version}.${ext}

publish:
  provider: github
  owner: Arkantik
  repo: ikusa_logger
